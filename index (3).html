<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hemmelig side</title>
<meta name="description" content="Skriv inn passordet for å åpne siden.">
<style>
:root {
  --bg: #f3efe6;
  --fg: #1c1a17;
  --muted: #6b655b;
  --line: #1c1a17;
  --err: #b3261e;
  --accent: #e8b400;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17150f; --fg: #f5efe0; --muted: #a39b8a; --line: #f5efe0; --err: #ff8a80; --accent: #ffcf2e;
  }
}
:root[data-theme="dark"] {
  --bg: #17150f; --fg: #f5efe0; --muted: #a39b8a; --line: #f5efe0; --err: #ff8a80; --accent: #ffcf2e;
}
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; min-height: 100%; background: var(--bg); color: var(--fg);
  font-family: "Bricolage Grotesque", "Arial Black", Impact, system-ui, sans-serif;
  display: grid; place-items: center; padding: 1.5rem; text-align: center;
}
main { width: 100%; max-width: 30rem; }
.hidden { display: none; }
label { display: block; font-size: 1.1rem; color: var(--muted); margin-bottom: 1rem; }
input {
  width: 100%; font: inherit; font-size: 1.6rem; font-weight: 700; text-align: center;
  padding: .7rem 1rem; color: var(--fg); background: transparent;
  border: 3px solid var(--line); border-radius: 0; outline: none;
}
input:focus-visible { box-shadow: 0 0 0 4px var(--accent); }
button {
  margin-top: 1rem; width: 100%; font: inherit; font-size: 1.2rem; font-weight: 700;
  padding: .8rem 1rem; cursor: pointer; border: 3px solid var(--line);
  background: var(--accent); color: #1c1a17; border-radius: 0;
}
button:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
#err { min-height: 1.5rem; margin-top: .8rem; color: var(--err); font-weight: 700; }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
#win { max-width: 100%; }
#win h1 {
  margin: 0; font-weight: 900; line-height: .95; text-transform: uppercase;
  font-size: clamp(3.5rem, 22vw, 11rem); letter-spacing: -.02em;
  animation: pop .6s cubic-bezier(.2,1.4,.4,1);
}
#win h1 span { display: block; }
#win h1 span + span { color: var(--accent); -webkit-text-stroke: 2px var(--fg); }
#win2 { max-width: 60rem; }
#win2 h1 {
  margin: 0 0 1.5rem; font-weight: 900; line-height: .95; text-transform: uppercase;
  font-size: clamp(2.5rem, 12vw, 6rem); letter-spacing: -.02em;
  animation: pop .6s cubic-bezier(.2,1.4,.4,1);
}
#win2 img { display: block; width: 100%; height: auto; max-width: 100%; border: 3px solid var(--line); }
#win3 { max-width: 60rem; }
#win3 h1 {
  margin: 0 0 1.5rem; font-weight: 900; line-height: .95; text-transform: uppercase;
  font-size: clamp(2rem, 9vw, 5rem); letter-spacing: -.02em;
  animation: pop .6s cubic-bezier(.2,1.4,.4,1);
}
#win3 .pics { display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-start; justify-content: center; }
#win3 .pics img { display: block; height: auto; max-width: 100%; border: 3px solid var(--line); }
#win3 .big { flex: 1 1 22rem; min-width: 0; }
#win3 .small { flex: 0 1 12rem; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .shake, #win h1, #win2 h1, #win3 h1 { animation: none; } }
</style>
</head>

  <label for="pw">Skriv inn passordet</label>

  <button id="go" type="button">Åpne</button>
  <div id="err" role="alert" aria-live="polite"></div>
</main>

<script>
(function () {
  var pw = document.getElementById('pw');
  var err = document.getElementById('err');
  var gate = document.getElementById('gate');
  var win = document.getElementById('win');
  var win2 = document.getElementById('win2');
  var win3 = document.getElementById('win3');
  function norm(s) { return s.toUpperCase().replace(/[^A-Z0-9]/g, ''); }
  function check() {
    var v = norm(pw.value);
    if (v === 'MRMOJO') {
      gate.classList.add('hidden');
      win.classList.remove('hidden');
      document.title = 'IVAR RISIN';
    } else if (v === 'IDONTGOTOCHURCHONSUNDAYS') {
      gate.classList.add('hidden');
      win2.classList.remove('hidden');
      document.title = 'HANS JACOB RISIN';
    } else if (v === 'IDONTGETONMYKNEESTOPRAY') {
      gate.classList.add('hidden');
      win3.classList.remove('hidden');
      document.title = 'THERES A CONCERT HALL IN VIENNA';
    } else {
      err.textContent = 'Feil passord. Prøv igjen.';
      pw.classList.remove('shake');
      void pw.offsetWidth;
      pw.classList.add('shake');
      pw.select();
    }
  }
  document.getElementById('go').addEventListener('click', check);
  pw.addEventListener('keydown', function (e) { if (e.key === 'Enter') check(); });
})();
</script>
